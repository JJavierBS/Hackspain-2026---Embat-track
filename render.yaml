# Render blueprint for the backend. No CSVs in the image: the frozen database carries the results
# tables and the S30 inputs (docs/DEPLOY.md). The database lives on a Render disk at /data, not on the
# container filesystem, so a restart keeps it. XRAY_DEMO_MODE is "true": the app serves the
# precomputed data and never runs the pipeline. The Algorithm page edits a draft and previews it on
# one entity, and the Entity page tunes one entity by sector. Neither one writes. Set it to "false"
# to allow "Aplicar y recalcular" and POST /api/pipeline/run again.
#
#   Render dashboard -> New -> Blueprint -> pick this repo.
#
# Regenerating the database is a local step; see docs/DEPLOY.md.
services:
  - type: web
    name: xray-backend
    runtime: docker
    # Free works but spins down after 15 min idle, and a cold start in front of the jury is a
    # ~1 min blank page. Starter stays warm.
    plan: starter
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    # Holds xray.duckdb (~112 MB), the run copy of a pipeline run and the DuckDB spill files.
    # A service with a disk has no zero-downtime deploy: each deploy stops the old instance first.
    disk:
      name: xray-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: XRAY_DATA_DIR
        value: /data
      - key: XRAY_DEMO_MODE
        value: "true"
