# The only place where thresholds, anchors, weights and lambda live (SPEC §9).
# Pending anchors are provisional; see docs/THRESHOLDS.md.
scoring:
  unit: GROUP                       # GROUP | COMPANY — confirm with Embat
  months: { start: "2024-09", end: "2026-08" }
  cash-product-types: [checking, saving, tpv, expensesPlatform]
  semi-liquid-types: [investment]
  booked-status-values: [booked]    # Q3: booked 2.52M, null 30k, pending 7k
  runway-cap-months: 24
  trajectory:
    smoothing-window: 3
    slope-window: 6
    min-points: 4
    slope-to-score-span: 5.0
    slope-weight: 0.7
    delta-weight: 0.3

  # Category values from profiling — see docs/DATA_FINDINGS.md Q1. Unmapped ("-", null, payment_refund) = OTHER.
  flow-classes:
    collection: OPERATING_IN
    bulk_collection: OPERATING_IN
    cash_settlement: OPERATING_IN
    cash_settlements: OPERATING_IN
    pos_settlement: OPERATING_IN
    payment: OPERATING_OUT
    bulk_payment: OPERATING_OUT
    utility: OPERATING_OUT
    salary: OPERATING_OUT
    fee: OPERATING_OUT
    collection_refund: OPERATING_OUT
    cash_withdrawal: OPERATING_OUT
    pos_withdrawal: OPERATING_OUT
    tax: TAX
    tax_refund: TAX
    social_security: TAX
    debt_repayment: DEBT_SERVICE
    interest_charge: DEBT_SERVICE
    transfer: INTERNAL
    investment_deployment: INTERNAL
    investment_return: INTERNAL
  default-flow-class: OTHER
  other-sign-fallback: true

  # Data semantics from profiling — see docs/DATA_FINDINGS.md (Q2, Q3, Q4, Q5, Q10).
  data-rules:
    fx-convention: NONE              # Q4: exchange_rate (DIVIDE convention) has bad outliers; use static rates only
    fx-target: LOCAL                 # Q4b: fx-to-eur converts the native (product / invoice currency) amount
    # Q4b: EUR per 1 unit. ECB reference rates 2026-09-01; AED AOA ARS BAM CLP COP GHS MAD MZN NAD PEN RUB SAR VND
    # XOF from @fawazahmed0/currency-api@2026-09-01 (no ECB rate).
    fx-to-eur:
      EUR: 1.0
      AED: 0.234669
      AOA: 0.000938203
      ARS: 0.000571245
      AUD: 0.616143
      BAM: 0.511292
      BRL: 0.165961
      CAD: 0.621272
      CHF: 1.06451
      CLP: 0.000922087
      CNY: 0.128352
      COP: 0.000267425
      CZK: 0.0413924
      DKK: 0.133783
      GBP: 1.16747
      GHS: 0.0765633
      HKD: 0.110039
      HUF: 0.00272695
      IDR: 0.0000486237
      ILS: 0.286221
      INR: 0.0090869
      ISK: 0.00710227
      JPY: 0.00538706
      MAD: 0.0926615
      MXN: 0.0507511
      MYR: 0.213593
      MZN: 0.0135032
      NAD: 0.0534819
      NOK: 0.0924343
      NZD: 0.508285
      PEN: 0.256226
      PHP: 0.0138207
      PLN: 0.230878
      RON: 0.190233
      RUB: 0.0099841
      SAR: 0.229819
      SEK: 0.0899726
      SGD: 0.677553
      THB: 0.0259376
      TRY: 0.0178732
      USD: 0.862813
      VND: 0.0000330193
      XOF: 0.00152449
      ZAR: 0.0534057
    invoice-direction: AMOUNT_SIGN   # Q2c: positive invoice -> counterparty that pays us
    invoice-issued-sign: 1
    invoice-excluded-document-types: [note, refund, deposit, paymentDocument, deliveryNote, purchaseOrder, other, cheque]   # Q2
    invoice-excluded-status-values: [cancel]   # Q3
    invoice-paid-status-values: [paid]         # Q10: payment_date is a real payment only for these statuses
    intragroup-rule: MIRROR_MATCH    # Q5: no counterparty is a company; 135k mirror pairs in 163 groups
    intragroup-max-lag-days: 2       # Q5b
    own-account-max-lag-days: 1      # Q5d: opposite amounts on two products of one company -> INTERNAL; -1 = off
    tx-excluded-abs-amounts: [999999999]   # Q12: sentinel amounts, dropped from staging
    interest-categories: [interest_charge]             # LEV_FUNDING_COST numerator (DATA_FINDINGS Q1)
    credit-line-debt-types: [lineofcredit]             # DEBT_LINE_UTIL (DATA_FINDINGS Q6)
    factoring-debt-types: [factoring, confirming]      # LEV_FACTORING_RELIANCE (SPEC §6)

  indicators:
    LIQ_RUNWAY:             { category: LIQUIDITY, method: anchors, status: closed, source: "runway literature", anchors: [[0,0],[1,20],[3,50],[6,75],[12,100]], weight: 0.4286 }
    LIQ_BUFFER:             { category: LIQUIDITY, method: anchors, status: closed, source: "coverage literature", anchors: [[0,0],[0.5,30],[1,60],[2,85],[3,100]], weight: 0.4286 }
    LIQ_MIN_BALANCE:        { category: LIQUIDITY, method: anchors, status: pending, source: "natural zero (overdraft <= 25) + quantiles (provisional)", anchors: [[-1,0],[0,25],[0.5,60],[1,80],[2,100]], weight: 0.1429 }
    CF_NOCF_MARGIN:         { category: OPERATING_CASH_FLOW, method: anchors, status: pending, source: "natural zero + quantiles (provisional)", anchors: [[-0.2,0],[-0.0001,35],[0,45],[0.1,75],[0.2,100]], weight: 0.4286 }
    CF_VOLATILITY:          { category: OPERATING_CASH_FLOW, method: anchors, status: pending, source: "quantiles only (provisional)", anchors: [[0.1,100],[0.3,70],[0.6,40],[1.0,15],[2.0,0]], weight: 0.1429 }
    CF_IN_OUT_RATIO:        { category: OPERATING_CASH_FLOW, method: anchors, status: closed, source: "coverage literature", anchors: [[0.8,10],[1.0,50],[1.2,80],[1.5,100]], weight: 0.4286 }
    ACT_COLLECTIONS_GROWTH: { category: ACTIVITY_GROWTH, method: anchors, status: pending, source: "natural zero (0% -> 50), symmetric + quantiles (provisional)", anchors: [[-0.3,0],[-0.15,25],[0,50],[0.15,75],[0.3,100]], weight: 1 }
    DEBT_DSCR:              { category: DEBT_SERVICE, method: anchors, status: closed, source: "bank covenant 1.25x", anchors: [[0.8,0],[1.0,30],[1.25,60],[2.0,85],[3.0,100]], weight: 0.75 }
    DEBT_LINE_UTIL:         { category: DEBT_SERVICE, method: anchors, status: closed, source: "credit line practice", anchors: [[0.5,100],[0.8,50],[1.0,0]], weight: 0.25 }
    LEV_DEBT_TO_CF:         { category: LEVERAGE, method: anchors, status: closed, source: "Debt/EBITDA practice", anchors: [[0,100],[1,90],[3,65],[5,40],[8,0]], weight: 0.6333 }
    LEV_FACTORING_RELIANCE: { category: LEVERAGE, method: anchors, status: pending, source: "natural zero (0% -> 100) + quantiles (provisional)", anchors: [[0,100],[0.2,70],[0.4,45],[0.7,15],[1.0,0]], weight: 0.2605 }
    LEV_FUNDING_COST:       { category: LEVERAGE, method: anchors, status: pending, source: "spread over reference-rate (provisional)", anchors: [[0,100],[0.01,85],[0.025,60],[0.05,30],[0.08,0]], weight: 0.1062 }
    PAY_DSO:                { category: PAYMENT_BEHAVIOUR, method: anchors, status: closed, source: "DSO practice", anchors: [[30,100],[60,70],[90,40],[150,0]], weight: 0.125 }
    PAY_DPO:                { category: PAYMENT_BEHAVIOUR, method: anchors, status: pending, source: "legal 60d (Ley 3/2004) + quantiles (provisional)", anchors: [[60,100],[90,60],[120,30],[180,0]], weight: 0.125 }
    PAY_SUPPLIER_LATENESS:  { category: PAYMENT_BEHAVIOUR, method: anchors, status: closed, source: "lateness practice", anchors: [[0,100],[15,70],[30,45],[60,0]], weight: 0.375 }
    PAY_OVERDUE_PAYABLES:   { category: PAYMENT_BEHAVIOUR, method: anchors, status: pending, source: "natural zero (0% -> 100) + quantiles (provisional)", anchors: [[0,100],[0.1,75],[0.25,45],[0.5,15],[0.8,0]], weight: 0.375 }
    DEL_OVERDUE_RECEIVABLES: { category: DELINQUENCY, method: anchors, status: pending, source: "natural zero (0% -> 100) + quantiles (provisional)", anchors: [[0,100],[0.1,75],[0.25,45],[0.5,15],[0.8,0]], weight: 0.25 }
    DEL_AGING_90:           { category: DELINQUENCY, method: anchors, status: closed, source: "aging practice", anchors: [[0,100],[0.1,70],[0.25,40],[0.5,0]], weight: 0.75 }
    CON_HHI_CUSTOMERS:      { category: CONCENTRATION, method: anchors, status: closed, source: "DOJ HHI 1000/1800", anchors: [[1000,100],[1800,60],[2500,45],[5000,20],[10000,0]], weight: 0.6 }
    CON_HHI_SUPPLIERS:      { category: CONCENTRATION, method: anchors, status: closed, source: "DOJ HHI 1000/1800", anchors: [[1000,100],[1800,60],[2500,45],[5000,20],[10000,0]], weight: 0.2 }
    CON_CUSTOMER_CHURN:     { category: CONCENTRATION, method: anchors, status: pending, source: "quantiles only (provisional)", anchors: [[0.0,100],[0.1,75],[0.25,45],[0.5,15],[0.8,0]], weight: 0.2 }
    TAX_REGULARITY:         { category: TAX_REGULARITY, method: anchors, status: closed, source: "own cadence", anchors: [[0,0],[0.5,40],[0.8,75],[1.0,100]], weight: 1 }

  profiles:   # provisional weights, external review pending
    BANK:    { lambda: 0.70, weights: { OPERATING_CASH_FLOW: 17.15, DEBT_SERVICE: 17.13, LIQUIDITY: 16.03, LEVERAGE: 11.97, DELINQUENCY: 6.84, PAYMENT_BEHAVIOUR: 6.84, TAX_REGULARITY: 6.01, MOMENTUM: 6.01, CONCENTRATION: 6.01, ACTIVITY_GROWTH: 6.01 } }
    FUND:    { lambda: 0.50, weights: { ACTIVITY_GROWTH: 22.25, MOMENTUM: 15.89, OPERATING_CASH_FLOW: 13.27, LIQUIDITY: 13.03, CONCENTRATION: 13.03, LEVERAGE: 7.46, DEBT_SERVICE: 4.25, PAYMENT_BEHAVIOUR: 4.25, DELINQUENCY: 4.25, TAX_REGULARITY: 2.32 } }
    INSURER: { lambda: 0.70, weights: { PAYMENT_BEHAVIOUR: 21.5, LIQUIDITY: 13.7, DELINQUENCY: 11.88, OPERATING_CASH_FLOW: 11.88, CONCENTRATION: 8.97, LEVERAGE: 8.97, DEBT_SERVICE: 7.45, TAX_REGULARITY: 7.45, MOMENTUM: 4.1, ACTIVITY_GROWTH: 4.1 } }

  # SPEC §8.1–§8.2. CUSUM runs on final and on the level scores of cusum-indicators (phase 4 decision E3).
  # Baseline = median and MAD x 1.4826 of the previous baseline-months non-null values, sigma >= sigma-floor (points).
  # Each z adds at most cusum-z-cap to the sums (Huber CUSUM), so one outlier cannot hold an alarm for months (E4).
  # sigma-floor and cusum-z-cap are PROVISIONAL: review with the status mix of the first run.
  regimes: { cusum-k: 0.5, cusum-h: 4.0, cusum-z-cap: 3.0, persistence-months: 3, slope-threshold: 1.5, dip-z: -2.0, dip-max-months: 2,
             baseline-months: 6, baseline-min-points: 4, sigma-floor: 2.0, dip-recovery-months: 2,
             slope-months: 6, slope-min-points: 4, cusum-indicators: [CF_NOCF_MARGIN, PAY_DSO, LIQ_RUNWAY] }
  bands: { a: 80, b: 65, c: 50, d: 35 }

  limit-engine:
    base: median_operating_in_3m
    score-floor: 35
    factor-at-floor: 0.25
    factor-at100: 1.5
    trend-modifier-span: 0.2
    runway-guard: { below-months: 1.5, multiplier: 0.5 }
    dscr-min: 1.25
    default-term-months: 36
    reference-rate: 0.035           # EXAMPLE value, not agreed with the experts (see CLAUDE.md open items)
    spread-bps-by-band: { A: 150, B: 250, C: 400, D: 650 }   # E missing = DECLINE
    action-threshold: 0.10
    rounding-eur: 1000              # SPEC §10.1: limit rounded to 1,000 EUR (down, never up)

  insurer:
    base-premium-rate: 0.0025
    multiplier-by-band: { A: 0.7, B: 1.0, C: 1.5, D: 2.5 }   # E missing = not insurable

  debt-dscr:
    no-debt-level: 100

  # SPEC §6: debt > 0 and NOCF_12m <= 0 -> level 0. SQL writes value NULL, available TRUE (phase 3 contract).
  lev-debt-to-cf:
    non-positive-cf-level: 0

  # SPEC §7.3: C(MOMENTUM) = TrajOverall + 2 pts per month of persistence, capped at +/-10, clamped [0,100].
  momentum:
    points-per-month: 2
    cap: 10

  # Phase 3 decision D9: only 4.9 % of operating inflow amount carries a counterparty_id (median 26 % per company).
  # CON_* are unavailable below this coverage of the window's operating flow. PROVISIONAL value, review after block 3.
  concentration:
    min-counterparty-coverage: 0.5

  # Phase 3 contract item 6: 12m windows annualize over active months; fewer than this -> unavailable.
  windows:
    annualize-min-months: 6

  # Phase 3 decision D2: cadence from the median gap between months with a TAX outflow.
  tax-regularity:
    window-months: 12
    monthly-max-median-gap: 1.5      # median gap <= this -> monthly cadence (1), else quarterly (3)
    monthly-cadence-months: 1
    quarterly-cadence-months: 3
    min-tax-months: 2                # fewer TAX months in the history up to m -> cadence unknown -> unavailable

  # SPEC §8.3: statuses in precedence order CRITICAL > STRUCTURAL_DECLINE > TURNING > DIP > IMPROVING > EXCEPTIONAL > HEALTHY > WATCH.
  statuses:
    critical-below: 35
    turning-min-level: 60
    turning-max-traj: 40
    improving-min-traj: 65
    exceptional-min-final: 85
    exceptional-min-traj: 45
    healthy-min-final: 65

  # SPEC §7.6: history = scored months up to m; share = available indicators of the profile's weighted categories.
  confidence:
    low-history-months: 6
    medium-history-months: 12
    low-available-share: 0.5

  # SPEC §7.5: narratives for the top movers of each entity-month-profile (phase 4 decision E6).
  explanation:
    narrative-top-n: 5
    min-narrated-delta: 0.05

  # Entity-page recommendations, docs/RECOMMENDATIONS.md. Output only: nothing in scoring, products or alerts reads
  # them. Survival levels (always ranked first) are the CRITICAL levels of alerts.runway-low, dscr-breach and
  # line-util-high. PROVISIONAL values: every one is explained in docs/RECOMMENDATIONS.md §3.
  recommendations:
    top-n: 3
    min-history-months: 3          # fewer scored months: no recommendation at all ("historial insuficiente")
    full-history-months: 6         # = confidence.low-history-months. Below: severe level problems only
    limited-max-level: 40          # with limited history, only indicators below this level
    problem-max-level: 60          # an indicator below this level is a problem
    high-max-level: 40             # severity HIGH below this level (bands.d is 35)
    critical-max-level: 20         # severity CRITICAL below this level
    trend-max-traj: 40             # = statuses.turning-max-traj: worsening at or below
    trend-high-max-traj: 25        # severity HIGH when worsening this fast
    trend-max-level: 80            # = bands.a: at or above it a falling trajectory is noise (M23 run: runway at the
                                   # 24-month cap and DSCR 2,000x were flagged as "worsening")
    target-level: 75               # the recovered level behind the points and the goal value
    min-points: 0.3                # smaller gains are noise (scores show 1 decimal); survival ignores it
    severity-factor: { critical: 3.0, high: 2.0, medium: 1.0 }
    aging-min-overdue-share: 0.05  # DEL_AGING_90 only when overdue receivables are at least this share of 3m sales
    growth-collapse-below: -0.9    # collections down 90 %+: ask whether activity stopped or an account is missing
    overtrading-min-growth: 0.3    # negative cash margin with collections up this much = growth that burns cash
    opportunity:
      min-final: 65                # = bands.b: opportunities only for B and above
      idle-cash-min-runway: 12     # months, the top anchor of LIQ_RUNWAY
      idle-cash-min-buffer: 3      # x, the top anchor of LIQ_BUFFER
      debt-capacity-min-dscr: 2.0  # the 85-point anchor of DEBT_DSCR
      debt-capacity-max-debt-to-cf: 1.0   # years, the 90-point anchor of LEV_DEBT_TO_CF

  # Phase 5 decision F5: which profile each product reads. SPEC §10: BANK limit, INSURER premium, FUND momentum.
  products:
    limit-profile: BANK
    premium-profile: INSURER
    momentum-profile: FUND
    momentum:                       # SPEC §10.3 "rising stars": level < 60 and traj >= 70
      rising-star-max-level: 60
      rising-star-min-traj: 70

  # SPEC §8.5 early-warning indicators (EBA/GL/2020/06), WARN / CRITICAL. PROVISIONAL: review with the first run.
  # "below" rules: runway-low, dscr-breach (critical < warn). The others are "above" rules (critical > warn).
  # dso-drift and supplier-lateness-up are days above the median of the previous drift-baseline-months values.
  # tax-gap is months since the last tax payment divided by the entity's own cadence.
  # factoring-spike: SPEC gives only 1.5x; the 3.0x critical level is ours (provisional).
  alerts:
    runway-low:           { warn: 3.0,  critical: 1.5 }
    dscr-breach:          { warn: 1.25, critical: 1.0 }
    line-util-high:       { warn: 0.80, critical: 0.95 }
    dso-drift:            { warn: 15,   critical: 30 }
    supplier-lateness-up: { warn: 10,   critical: 20 }
    overdue-receivables:  { warn: 0.20, critical: 0.35 }
    tax-gap:              { warn: 1.0,  critical: 2.0 }
    concentration-high:   { warn: 2500, critical: 5000 }
    factoring-spike:      { warn: 1.5,  critical: 3.0 }
    score-drop:           { warn: 8,    critical: 15 }
    score-drop-months: 3
    drift-baseline-months: 6
    drift-baseline-min-points: 4
    band-downgrade-critical-steps: 2
    # Watchlist = moves, not states (brief: "levanta la mano cuando una empresa se mueve de verdad").
    # An alert counts when its negative run is confirmed (on confirm-months in a row) and new (confirmed
    # in the last recent-months). A long-lasting condition shows in the entity status, not here.
    # confirm-months: the same 2 months SPEC §8.4 needs for every deterioration event.
    # recent-months: the same window as score-drop-months. No value is fitted to the data.
    watchlist: { min-critical: 1, min-warn: 2, confirm-months: 2, recent-months: 3 }

  # SPEC §8.4 lead time. Phase 6 decisions G3–G7. PROVISIONAL: review with the first run.
  lead-time:
    min-history-months: 6
    window-months: 12
    horizon-months: 6
    events:
      runway-below: 1.5
      runway-months: 2
      dscr-below: 1.0
      dscr-months: 2
      overdue-max-level: 20        # both DEL_OVERDUE_RECEIVABLES and PAY_OVERDUE_PAYABLES, pending anchors
      score-below: 35
      improvement-cross: 65
      improvement-cross-months: 2  # same hold as runway-months and dscr-months: one proof for both directions
      improvement-below: 50
      improvement-below-months: 3
    signal:
      deterioration-statuses: [TURNING, STRUCTURAL_DECLINE]
      deterioration-max-traj: 35
      improvement-statuses: [IMPROVING]
      improvement-min-traj: 65
      # The signal credited to an event is the run of signal months that reaches it: on at the event,
      # or off for at most this many months in a row, inside the run and before the event.
      # Without it, a signal from an earlier, recovered decline got the credit (review of 2026-09-19).
      max-gap-months: 1
  # SPEC §10.4 showcase pairs. Phase 6 decision G9.
  showcase:
    max-final-gap: 3
    up-min-traj: 65
    down-max-traj: 35
    top-n: 10

  # Phase 7 score projection (decisions H11–H16). Method and values from the backtest in docs/FORECAST.md:
  # AR(1) toward the entity's own median beats persistence from h = 2; the damped linear trend loses to it.
  # Output only: nothing in scoring, products, alerts or analytics reads forecast_points.
  forecast:
    mean-reversion: 0.85            # rho: best h1..h3 MAE on GROUP and COMPANY (FORECAST.md table 1)
    max-horizon-months: 6           # past 6 the projection is the median; MAE ~16 pts, above one band width
    min-points: 3                   # fewer scored months: no projection at all
    min-history-months: 6           # below: LOW (h1 MAE 12-20 pts, no better than persistence)
    medium-history-months: 8        # below: MEDIUM; from here on the error is close to the 12+ months level
