spring:
  application:
    name: xray
  config:
    import: classpath:scoring-config.yml
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}

xray:
  data-dir: ${XRAY_DATA_DIR:../data}
  demo-mode: ${XRAY_DEMO_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.xray: DEBUG
