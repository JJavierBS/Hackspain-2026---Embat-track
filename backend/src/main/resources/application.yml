spring:
  application:
    name: xray
  config:
    # The expert overrides written by PUT /api/config win over the shipped defaults (later import wins).
    import:
      - classpath:scoring-config.yml
      - optional:file:${XRAY_DATA_DIR:../data}/scoring-overrides.yml
  jackson:
    default-property-inclusion: always

server:
  # Render (and most PaaS hosts) inject PORT; SERVER_PORT stays for local overrides.
  port: ${PORT:${SERVER_PORT:8080}}

xray:
  data-dir: ${XRAY_DATA_DIR:../data}
  demo-mode: ${XRAY_DEMO_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.xray: DEBUG
