# Test-only overrides. An in-memory H2 database in Postgres mode replaces
# the real Postgres connection, so `make test` runs without Docker.
spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
