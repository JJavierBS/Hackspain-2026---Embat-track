# Full stack as deployed (SPEC §14): demo mode, precomputed data, no pipeline run.
#   docker compose up --build
#   XRAY_DEMO_MODE=false docker compose up -d    # allow "Aplicar y recalcular" (needs the CSVs in ./data/raw)
name: xray

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      XRAY_DATA_DIR: /data
      XRAY_DEMO_MODE: ${XRAY_DEMO_MODE:-true}
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
