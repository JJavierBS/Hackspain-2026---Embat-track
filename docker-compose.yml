# Full stack as deployed (SPEC §14). Put the CSVs in ./data/raw first.
#   docker compose up --build
#   XRAY_DEMO_MODE=true docker compose up -d     # frozen xray.duckdb, pipeline disabled
name: xray

services:
  backend:
    build:
      # Repo root, so the image can copy the frozen data/xray-demo.duckdb.gz.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      XRAY_DATA_DIR: /data
      XRAY_DEMO_MODE: ${XRAY_DEMO_MODE:-false}
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
